name: astrbot_plugin_jmcomic
display_name: 漫画下载插件
short_desc: 漫画搜索、详情、评论、PDF/ZIP 下载、签到、收藏
desc: |
  漫画站助手插件，基于 jmcomic 库开发，支持全站/作者/标签/角色/原作搜索、详情查看、评论翻页、下载 PDF/ZIP、按话选择、PDF 按页数分册（单话超限自动切分）、ZIP 按话数+页数合并、页段续传、批量下载、`/jmnow` 下载进度查询（`-all` 管理员查看全部用户）、`/jmnext` 与“下一页/下页”自动翻页、请求级域名重试、HTTP/SOCKS5 代理、`/jmphoto` 单话兼容别名、`/jmstop` 停止下载（`-all` 管理员停止全部用户）、每日签到、收藏夹管理与 CSV 导出、`/jmsub` 订阅更新推送、群白名单、jms 纯数字查详情、排行榜、随机推荐、下载历史分页、号主权限、QQ 文件限额、敏感词自动转拼音、简繁自动转换等功能，所有参数均可在配置页自定义。v0.7.5 起缓存目录只保留 ID，标题写入 metadata.json，并在 ZIP/PDF 中附带标题信息；v0.7.6 起同一话的多个不连续页段会分别保留，不再误包含中间页；v0.7.7 起新增请求级重试与代理；v0.7.8 起新增群白名单、jms 纯数字查详情、收藏夹 CSV 导出（30 秒二次确认）和 `/jmsub` 订阅更新推送，并统一分册命名 `JM{漫画id}_P{话序号}`、每个 PDF 分册加信息页、缓存/ZIP 目录改为 `P{章节id}_第N话`、`jmlist`/`jmhis` 统一分页；同一版本后续加入 BUG-013 消息压缩、`/jmnow`、翻页会话和话列表页数显示；配置默认值调整为 PDF 每册 200 页、`jms` 纯数字默认按车号查详情。v0.7.9 起新增请求超时/重试、登录态缓存、下载重试、批量目标上限、详情封面、二次确认有效期、订阅推送条数、文字翻页开关和信息页开关等 11 个配置项。
version: 0.7.9
author: wnzmb
repo: https://github.com/wnzmb/astrbot_plugin_jmcomic
astrbot_version: ">=4.0.0"
